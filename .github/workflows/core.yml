name: bounded-core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
      EVIDENCE: ${{ runner.temp }}/cegar-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare evidence
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/tested-commit.txt"
          python3 --version > "$EVIDENCE/python-version.txt"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml crates/cegar-core/Cargo.toml crates/cegar-core/src/lib.rs crates/cegar-core/tests/verification.rs crates/cegar-core/examples/oracle_driver.rs scripts/differential.py > "$EVIDENCE/source-sha256.txt"
      - name: Install exact compiler
        id: toolchain
        shell: bash
        run: |
          set -o pipefail
          rustup toolchain install beta-2026-11-07 --profile minimal --component rustfmt --component clippy 2>&1 | tee "$EVIDENCE/toolchain.txt"
          rustc -Vv | tee "$EVIDENCE/rustc.txt"
          cargo -V | tee "$EVIDENCE/cargo.txt"
      - name: Formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee "$EVIDENCE/format.txt"
      - name: Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.txt"
      - name: Debug tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --offline -- --nocapture 2>&1 | tee "$EVIDENCE/test-debug.txt"
      - name: Release tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release --locked --offline -- --nocapture 2>&1 | tee "$EVIDENCE/test-release.txt"
      - name: Independent Python-to-Rust comparison
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo build --example oracle_driver --locked --offline 2>&1 | tee "$EVIDENCE/build-driver.txt"
          python3 scripts/differential.py --driver target/debug/examples/oracle_driver 2>&1 | tee "$EVIDENCE/differential.txt"
      - name: Preserve formatting remediation outside Git
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo fmt --all
          git diff --binary > "$EVIDENCE/format.patch"
          mkdir -p "$EVIDENCE/formatted"
          cp crates/cegar-core/src/lib.rs "$EVIDENCE/formatted/lib.rs"
          cp crates/cegar-core/tests/verification.rs "$EVIDENCE/formatted/verification.rs"
          cp crates/cegar-core/examples/oracle_driver.rs "$EVIDENCE/formatted/oracle_driver.rs"
      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cegar-core-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 30
          if-no-files-found: error
